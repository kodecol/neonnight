name: 🐛 Reporte de bug
description: Algo no funciona como debería.
labels: ["tipo: bug", "estado: por revisar"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el problema y qué esperabas que pasara.
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ir a /coleccion
        2. Filtrar por "Cronógrafos"
        3. …
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Área
      options: [Tienda, Carrito y checkout, Pagos (Bold), Panel /admin, Despliegue o infraestructura, Otra]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Versión
      description: El campo `version` de https://neonightonline.com/api/health, si aplica.
  - type: textarea
    id: entorno
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 130 en iPhone 15 / Firefox en Windows…
  - type: markdown
    attributes:
      value: "**No pegues contraseñas, llaves, tokens ni datos de clientes.** Una vulnerabilidad se reporta en privado (ver SECURITY.md)."
