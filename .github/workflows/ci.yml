# CI de Neon Night (plantilla jewelry-store): verifica cada PR y cada push a main.
# No despliega: producción se publica con Kode (`kode deploy neonnight`), ver docs/DEPLOY.md.
name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: neonnight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # El título del PR sigue gitmoji (docs/GITHUB.md §3).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validar título gitmoji
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-msg.mjs --text "$TITLE"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  # Que compile como en producción y que la salida standalone ARRANQUE como en el hosting
  # (sin el árbol del repo): brand pack aplicado y un pack ausente sin tumbar la tienda.
  build:
    needs: check
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: scripts/smoke-standalone.sh
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
