# CI/CD de Neon Night.
#  - Pull request → verificación (typecheck, lint, tests).
#  - Push a main  → verificación → imagen en GHCR (tag = SHA corto) → despliegue en el VPS → comprueba la versión servida.
# El VPS nunca compila: solo descarga la imagen.
#
# Secretos del repo:  DEPLOY_SSH_KEY, DEPLOY_HOST_KEY, DEPLOY_HOST, DEPLOY_USER
# Variables del repo: SITE_URL (https://neonightonline.com) y DEPLOY_ENABLED (true para activar build y deploy)
name: ci-cd

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: neonnight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/neonnight-web

jobs:
  # El título del PR es el mensaje del commit al hacer squash: debe seguir gitmoji (docs/GITHUB.md §3).
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validar título gitmoji
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-commit-msg.mjs --text "$TITLE"

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check

  # build y deploy solo corren cuando la infraestructura está lista (variable DEPLOY_ENABLED=true).
  build:
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          build-args: BUILD_SHA=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read, packages: read }
    steps:
      - name: Preparar SSH (huella del VPS fijada)
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts
      - name: Desplegar en el VPS
        env:
          TAG: ${{ needs.build.outputs.tag }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # La llave del CI tiene orden forzada (deploy/ci-deploy.sh): solo acepta "<imagen> <usuario>".
          # El token de GHCR viaja por stdin (no queda en `ps`) y la sesión se cierra al terminar.
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes "$USER@$HOST" "${{ env.IMAGE }}:$TAG ${{ github.actor }}"
      - name: Comprobar la versión servida en producción
        env:
          TAG: ${{ needs.build.outputs.tag }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          for i in $(seq 1 10); do
            curl -fsS "$SITE_URL/api/health" | grep -q "\"version\":\"$TAG\"" && { echo "✓ Producción sirve $TAG"; exit 0; }
            sleep 6
          done
          echo "✗ Producción no sirve $TAG"; exit 1
