# Neon Night en el VPS de producción compartido, aislado de los demás servicios.
# Vive en /opt/apps/neonnight/docker-compose.yml y NO se ejecuta en otra carpeta.
# La imagen `neonnight-web:current` la mueve deploy.sh; en el VPS nunca se compila.
# Publicación: nginx-proxy-manager (red externa `proxy`) → neonnight-web:3000.
name: neonnight

services:
  web:
    image: neonnight-web:current
    container_name: neonnight-web
    restart: unless-stopped
    env_file: .env
    environment:
      # Heap de V8 por debajo del límite: Node libera memoria antes de llegar al tope.
      NODE_OPTIONS: --max-old-space-size=384
      # Fotos sin Cloudinary (solo como respaldo): en el volumen, porque la raíz es de solo lectura.
      MEDIA_DIR: /app/.next/cache/uploads
    # Solo loopback, para que deploy.sh verifique desde el host. El público entra por nginx-proxy-manager.
    ports:
      - "127.0.0.1:3100:3000"
    # Límites: la máquina es compartida con otros servicios de producción.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=64m
    volumes:
      - cache:/app/.next/cache # caché de next/image (y fotos de respaldo)
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [proxy]

networks:
  proxy:
    external: true

volumes:
  cache:
    name: neonnight-cache
